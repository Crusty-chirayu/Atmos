<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#020617" />
      <stop offset="100%" stop-color="#010309" />
    </radialGradient>
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Atmospheric Glow Ring -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.6" />
  <circle cx="256" cy="256" r="188" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 12" opacity="0.4" />

  <!-- Core Planetary Sphere -->
  <circle cx="256" cy="256" r="132" fill="url(#planetGrad)" filter="url(#glow)" />

  <!-- Atmospheric Limb / Aura -->
  <path d="M 160 160 Q 256 120 352 160 Q 320 280 256 340 Q 190 280 160 160 Z" fill="#ffffff" opacity="0.12" />

  <!-- Stylized Cloud Vector Band -->
  <path d="M 145 225 Q 185 200 235 210 Q 285 220 335 195 Q 367 215 350 240 Q 300 255 240 245 Q 180 235 145 225 Z" fill="#ffffff" opacity="0.35" />
  <path d="M 165 270 Q 215 285 270 275 Q 325 265 355 285 Q 330 310 275 305 Q 220 300 165 270 Z" fill="#ffffff" opacity="0.25" />

  <!-- Luminous Center Beacon -->
  <circle cx="256" cy="256" r="12" fill="#ffffff" opacity="0.9" />
  <circle cx="256" cy="256" r="24" fill="#38bdf8" opacity="0.4" />
</svg>
